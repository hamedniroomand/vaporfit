# yaml-language-server: $schema=https://unpkg.com/undocs-nightly/schema/config.json

name: vaporfit
shortDescription: See what will silently break
description: Before you add vapor to a Vue component, see what will silently break.
github: hamedniroomand/vaporfit
# The OG images, the canonical links, llms.txt and the sitemap use this address.
url: https://vaporfit.kitdev.space
lang: en
themeColor: amber

llms:
  title: vaporfit
  description: vaporfit checks the components in a Vue project before you add vapor. It reports the problems it knows about. These pages have the guide, the library table, the rules and the upstream reports.
  full:
    title: vaporfit documentation
    description: All pages of the vaporfit documentation in one file. It has the guide, the library table, the rules and the upstream reports.

# The page `.docs/pages/index.vue` is the landing page.
landing: true

footer:
  notes:
    - 'Released under the [MIT License](https://github.com/hamedniroomand/vaporfit/blob/main/LICENSE).'
    - '"ready" means that vaporfit found no known problem. It does not test behavior.'
