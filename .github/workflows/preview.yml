name: Preview

# Publishes a build of each pull request with pkg.pr.new, and adds the link to the pull request.
# The pkg.pr.new GitHub App must be installed on the repository. Nothing goes to npm.
# Try a build with:
#   npx https://pkg.pr.new/vaporfit@<pr-number>

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  preview:
    if: github.repository_owner == 'hamedniroomand'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version: 22
          cache: true
      - run: vp run build
      - run: npx --yes pkg-pr-new@0.0.88 publish --compact --pnpm
