name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ready:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version-file: .node-version
          cache: true
      - name: Install Chrome
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2
      # The tests read the installed packages of the test fixture and of the repros.
      - name: Install the test fixture
        run: vp -C test/fixtures/shadcn install --frozen-lockfile -- --ignore-workspace
      - name: Repros
        run: vp run repros
      - name: Ready
        run: vp run ready
      - name: Coverage
        run: vp test --coverage
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: coverage/lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
      - name: Check the package (publint, are-the-types-wrong)
        run: |
          vp dlx publint --pack npm --strict .
          vp dlx @arethetypeswrong/cli --pack . --profile esm-only
