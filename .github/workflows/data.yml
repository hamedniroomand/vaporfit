name: Data

on:
  pull_request:
    paths:
      - 'data/**'
      - 'repros/**'
      - 'scripts/check-data.ts'
      - 'scripts/changed-probes.ts'
      - 'src/upkeep/**'

permissions:
  contents: read

jobs:
  data:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version: 22
          cache: true
      - name: Install Chrome
        uses: browser-actions/setup-chrome@v2
      - name: Loader checks
        run: vpx scripts/check-data.ts | tee "$RUNNER_TEMP/data-check.txt"
      - name: Probes of the changed libraries
        run: |
          set -euo pipefail
          git diff --name-only "${{ github.event.pull_request.base.sha }}" HEAD -- data/libraries repros > "$RUNNER_TEMP/changed.txt"
          mapfile -t files < "$RUNNER_TEMP/changed.txt"
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No library file or probe changed." | tee "$RUNNER_TEMP/probes.txt"
          else
            vpx scripts/changed-probes.ts "${files[@]}" > "$RUNNER_TEMP/names.txt"
            if [ ! -s "$RUNNER_TEMP/names.txt" ]; then
              echo "The changed libraries have no probe." | tee "$RUNNER_TEMP/probes.txt"
            else
              mapfile -t args < "$RUNNER_TEMP/names.txt"
              node repros/check.mjs "${args[@]}" | tee "$RUNNER_TEMP/probes.txt"
            fi
          fi
      - name: Add the result to the pull request
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          {
            echo "### Data check"
            echo
            echo '```'
            cat "$RUNNER_TEMP/data-check.txt" 2>/dev/null || echo "(no output)"
            echo '```'
            echo
            echo "### Probes"
            echo
            echo '```'
            cat "$RUNNER_TEMP/probes.txt" 2>/dev/null || echo "(no output)"
            echo '```'
          } > "$RUNNER_TEMP/comment.md"
          gh pr comment "${{ github.event.pull_request.number }}" --body-file "$RUNNER_TEMP/comment.md"
