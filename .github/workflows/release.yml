name: Release

# Publishes vaporfit to npm when a version tag such as `v0.1.0` is pushed.
# It uses npm trusted publishing (OIDC), so no npm token is stored in the repository.
# npm only accepts it after the package exists and this workflow is registered as its trusted
# publisher. Publish the first version by hand, then connect this workflow on npm
# (Settings → Trusted publishing, workflow filename release.yml, environment npm).

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # Must match the environment set on the npm trusted publisher.
    environment: npm
    permissions:
      # Creates the GitHub release.
      contents: write
      # Proves to npm that this workflow is the trusted publisher.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          # Trusted publishing needs npm 11.5.1 or later. Node 24 ships that npm.
          node-version: 24
          cache: true
      - name: Check the tag matches the package version
        run: |
          version=$(vp node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package version $version"
            exit 1
          fi
      # The tests read the installed packages of the test fixture and of the repros.
      - name: Install the test fixture and the repros
        run: |
          vp -C test/fixtures/shadcn install --frozen-lockfile -- --ignore-workspace
          for dir in repros/*/; do vp -C "$dir" install --frozen-lockfile; done
      - run: vp run ready
      - name: Check npm
        run: vp node -e "const [a, b, c] = process.argv[1].split('.').map(Number); if (a < 11 || (a === 11 && (b < 5 || (b === 5 && c < 1)))) { console.error('npm ' + process.argv[1] + ' is older than 11.5.1'); process.exit(1); }" "$(npm --version)"
      - name: Pack
        run: vp pm pack --pack-destination "$RUNNER_TEMP/package"
      - name: Publish
        run: |
          tag=latest
          case "$GITHUB_REF_NAME" in *-*) tag=next ;; esac
          npm publish "$RUNNER_TEMP"/package/vaporfit-*.tgz --access public --tag "$tag"
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [ -f CHANGELOG.md ]; then
            # The changelog section of this version, without its heading.
            awk -v heading="## $version" '
              $0 == heading { found = 1; next }
              found && /^## / { exit }
              found { print }
            ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          else
            echo "No changelog file for this version." > "$RUNNER_TEMP/notes.md"
          fi
          # Append the issues closed by the pull requests in this release. The changelog section
          # already links the pull requests. The release is already published to npm, so a failure
          # here only drops this section.
          {
            gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" -f tag_name="$GITHUB_REF_NAME" \
              --jq .body > "$RUNNER_TEMP/generated.md"
            prs=$(grep -oE "/pull/[0-9]+" "$RUNNER_TEMP/generated.md" | cut -d/ -f3 | sort -un)
            issues=""
            for pr in $prs; do
              issues+=$(gh api graphql -F owner="${GITHUB_REPOSITORY%/*}" -F repo="${GITHUB_REPOSITORY#*/}" -F pr="$pr" \
                -f query='query($owner: String!, $repo: String!, $pr: Int!) { repository(owner: $owner, name: $repo) { pullRequest(number: $pr) { closingIssuesReferences(first: 20) { nodes { number title } } } } }' \
                --jq '.data.repository.pullRequest.closingIssuesReferences.nodes[] | "- #\(.number) \(.title)"')$'\n'
            done
            issues=$(echo "$issues" | sed '/^$/d' | sort -u)
            if [ -n "$issues" ]; then
              printf '\n## Issues closed\n\n%s\n' "$issues" >> "$RUNNER_TEMP/notes.md"
            fi
          } || echo "::warning::Could not list the issues closed in the release notes"
          prerelease=()
          case "$GITHUB_REF_NAME" in *-*) prerelease=(--prerelease) ;; esac
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md" "${prerelease[@]}"
