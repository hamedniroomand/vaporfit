name: Bug report
description: The CLI, the local report, the MCP server or the docs do not work as described.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you ran, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: A repository, or the smallest project and command that shows the problem.
      placeholder: |
        1. npm install vaporfit
        2. npx vaporfit --root path/to/project
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output
      description: The full output of the command.
      render: text
  - type: input
    id: version
    attributes:
      label: vaporfit version
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Vue version, Node.js version and OS
      placeholder: Vue 3.6.0-rc.14, Node 22.18, macOS 15
